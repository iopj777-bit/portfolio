<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <g font-family="Pretendard,'Malgun Gothic',sans-serif">

    <!-- Before -->
    <text x="600" y="66" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="600" letter-spacing="1.5" fill="#71757F">BEFORE · 하위 단계가 화면에 숨어 있음</text>

    <rect x="150" y="88" width="900" height="150" rx="18" fill="#F3F4F8" stroke="#DCDEE5" stroke-width="1.5"/>

    <line x1="200" y1="160" x2="1000" y2="160" stroke="#C7CAD3" stroke-width="2"/>
    <g fill="#FFFFFF" stroke="#C7CAD3" stroke-width="1.5">
      <circle cx="200" cy="160" r="11"/>
      <circle cx="360" cy="160" r="11"/>
      <circle cx="520" cy="160" r="11"/>
      <circle cx="680" cy="160" r="11"/>
      <circle cx="840" cy="160" r="11"/>
      <circle cx="1000" cy="160" r="11"/>
    </g>

    <path d="M 500 181 Q 520 200 520 210" fill="none" stroke="#C7CAD3" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M 540 181 Q 520 200 520 210" fill="none" stroke="#C7CAD3" stroke-width="1.2" stroke-dasharray="3 3"/>
    <g fill="#C7CAD3">
      <circle cx="497" cy="216" r="5"/>
      <circle cx="520" cy="216" r="5"/>
      <circle cx="543" cy="216" r="5"/>
    </g>

    <text x="600" y="216" text-anchor="middle" font-size="16" fill="#5A5E68">일부 단계 안에 하위 단계가 섞여 있어 진행 상황 파악이 어려움</text>

    <!-- arrow -->
    <path d="M 520 244 Q 500 268 480 292" fill="none" stroke="#1B45D7" stroke-width="2.5"/>
    <path d="M 466 277 L 480 302 L 497 279 Z" fill="#1B45D7"/>
    <text x="548" y="272" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#1B45D7">통합</text>

    <!-- After -->
    <text x="600" y="298" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="600" letter-spacing="1.5" fill="#1B45D7">AFTER · 단계 표시기 개선 + 하위 단계 통합</text>

    <rect x="150" y="320" width="900" height="540" rx="18" fill="#FFFFFF" stroke="#1B45D7" stroke-width="2"/>

    <rect x="190" y="350" width="118" height="36" rx="18" fill="#1B45D7"/>
    <text x="249" y="373" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="15" font-weight="700" letter-spacing="1" fill="#FFFFFF">STEP 2 / 4</text>

    <line x1="260" y1="452" x2="920" y2="452" stroke="#DCDEE5" stroke-width="3" stroke-dasharray="5 5"/>
    <line x1="260" y1="452" x2="480" y2="452" stroke="#1B45D7" stroke-width="3"/>

    <circle cx="480" cy="452" r="38" fill="none" stroke="#1B45D7" stroke-opacity=".18" stroke-width="7"/>

    <circle cx="260" cy="452" r="23" fill="#1B45D7"/>
    <path d="M 249 452 L 257 461 L 273 444" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="480" cy="452" r="29" fill="#FFFFFF" stroke="#1B45D7" stroke-width="4"/>
    <text x="480" y="461" text-anchor="middle" font-size="22" font-weight="800" fill="#1B45D7">2</text>

    <circle cx="700" cy="452" r="23" fill="#FFFFFF" stroke="#DCDEE5" stroke-width="2"/>
    <text x="700" y="459" text-anchor="middle" font-size="17" font-weight="700" fill="#9AA0AC">3</text>

    <circle cx="920" cy="452" r="23" fill="#FFFFFF" stroke="#DCDEE5" stroke-width="2"/>
    <text x="920" y="459" text-anchor="middle" font-size="17" font-weight="700" fill="#9AA0AC">4</text>

    <text x="260" y="504" text-anchor="middle" font-size="15" fill="#71757F">본인 확인</text>
    <text x="480" y="504" text-anchor="middle" font-size="15" font-weight="700" fill="#1B45D7">신청정보 입력</text>
    <text x="700" y="504" text-anchor="middle" font-size="15" fill="#9AA0AC">서류 제출</text>
    <text x="920" y="504" text-anchor="middle" font-size="15" fill="#9AA0AC">완료</text>

    <text x="600" y="546" text-anchor="middle" font-size="16" fill="#2C2F38">화면 안에 흩어져 있던 하위 단계를 하나로 통합하고, 현재 위치를 명확히 보여주는</text>
    <text x="600" y="568" text-anchor="middle" font-size="16" fill="#2C2F38">단계 표시기를 적용했습니다.</text>

    <line x1="190" y1="600" x2="1010" y2="600" stroke="#DCDEE5" stroke-width="1"/>

    <text x="190" y="634" font-family="'JetBrains Mono',monospace" font-size="15" font-weight="700" letter-spacing="1" fill="#1B45D7">KRDS 적용 컴포넌트</text>

    <g font-size="15" font-weight="600" fill="#1B45D7">
      <rect x="190" y="654" width="128" height="40" rx="20" fill="#FFFFFF" stroke="#1B45D7" stroke-width="1.5"/>
      <text x="254" y="679" text-anchor="middle">단계표시기</text>

      <rect x="334" y="654" width="168" height="40" rx="20" fill="#FFFFFF" stroke="#1B45D7" stroke-width="1.5"/>
      <text x="418" y="679" text-anchor="middle">텍스트 입력 필드</text>

      <rect x="518" y="654" width="152" height="40" rx="20" fill="#FFFFFF" stroke="#1B45D7" stroke-width="1.5"/>
      <text x="594" y="679" text-anchor="middle">날짜 입력 필드</text>

      <rect x="686" y="654" width="128" height="40" rx="20" fill="#FFFFFF" stroke="#1B45D7" stroke-width="1.5"/>
      <text x="750" y="679" text-anchor="middle">텍스트영역</text>

      <rect x="830" y="654" width="128" height="40" rx="20" fill="#FFFFFF" stroke="#1B45D7" stroke-width="1.5"/>
      <text x="894" y="679" text-anchor="middle">파일업로드</text>

      <rect x="190" y="706" width="88" height="40" rx="20" fill="#FFFFFF" stroke="#1B45D7" stroke-width="1.5"/>
      <text x="234" y="731" text-anchor="middle">동의</text>

      <rect x="294" y="706" width="108" height="40" rx="20" fill="#FFFFFF" stroke="#1B45D7" stroke-width="1.5"/>
      <text x="348" y="731" text-anchor="middle">입력 폼</text>
    </g>

    <text x="190" y="810" font-size="14" fill="#9AA0AC">KRDS 컴포넌트 &gt; 피드백 · 입력, 기본 패턴 &gt; 동의 · 입력 폼</text>

  </g>
</svg>
